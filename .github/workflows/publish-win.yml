name: Publish Windows VST3

# Manual-only: build the Windows VST3 and publish it as a zip on the orphan
# branch `ci-win`, so it can be pulled over git (artifact blob storage is not
# always reachable). Does not run the full CI suite.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  JUCE_TAG: "8.0.4"

jobs:
  win:
    name: build + publish (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE source
        uses: actions/cache@v4
        with:
          path: deps
          key: juce-Windows-8.0.4

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCHRONA_LTO=OFF
          -DCHRONA_COPY_AFTER_BUILD=OFF
          -DCHRONA_BUILD_STANDALONE=OFF
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/deps

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $vst3 = "build/CHRONA_artefacts/Release/VST3"
          Compress-Archive -Path "$vst3/*" -DestinationPath "out/CHRONA-windows-x64.zip" -Force
          Get-ChildItem out

      - name: Publish to ci-win branch
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pub && cp out/CHRONA-windows-x64.zip /tmp/pub/
          cd /tmp/pub
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI: Windows VST3 build [skip ci]"
          git branch -M ci-win
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-win
          echo "published CHRONA-windows-x64.zip to ci-win"
